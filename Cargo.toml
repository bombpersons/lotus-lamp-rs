[package]
name = "lotus-lamp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust API and CLI for LED strips controlled by the Lotus Lamp X app (ELK-BLEDOM / MELK BLE protocol)"
repository = "https://github.com/bombpersons/lotus-lamp-rs"

[dependencies]
btleplug = "0.13.5"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
uuid = "1.28.0"

# btleplug talks to BlueZ over D-Bus on Linux; vendor libdbus so no system dev package is needed.
[target.'cfg(target_os = "linux")'.dependencies]
libdbus-sys = { version = "0.2.7", features = ["vendored"] }
